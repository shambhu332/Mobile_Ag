name: Project validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -c requirements/validated-python314.txt ".[test]"
      - run: python -m pytest -q
      - run: python -m build --wheel
      - run: python scripts/verify-dashboard-assets.py
      - name: Smoke installed wheel outside source checkout
        run: |
          TARGET=$(mktemp -d)
          python -m pip install --no-deps --target "$TARGET" dist/*.whl
          cd "$(mktemp -d)"
          PYTHONPATH="$TARGET" python "$GITHUB_WORKSPACE/scripts/wheel-smoke.py" --target "$TARGET"
      - name: Browser regression (synthetic, devices disabled)
        run: |
          npm ci --prefix assets --ignore-scripts
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python tests/browser_product_regression.py --server-python "$(command -v python)" --chromium "$CHROMIUM" --axe assets/node_modules/axe-core/axe.min.js --output "$RUNNER_TEMP/browser-results"
