[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mobileag*", "config*"]

[tool.setuptools.package-data]
mobileag = ["web/templates/*.html", "web/static/**/*", "web/static/*", "studio/assets/*.html", "studio/assets/*.css", "studio/assets/*.js", "data/*.json", "reporting/templates/*.j2", "generators/templates/**/*.j2"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "build", "lxml"]
frida = ["frida"]

[project]
name = "mobileag"
version = "0.1.0"
description = "Multi-LLM mobile security analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "google-genai",
    "openai",
    "anthropic",
    "neo4j",
    "qdrant-client",
    "psycopg2-binary",
    "click",
    "jinja2",
    "pydantic",
    "jsonschema>=4,<5",
    "openapi-spec-validator==0.9.0",
    "packageurl-python==0.17.6",
    "rich",
    "python-dotenv",
    "aiohttp",
    "httpx",
    "h11",
    "weasyprint",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pyelftools",
    # AST support is part of default taint review; do not silently make normal
    # installations lexical-only.
    "tree-sitter>=0.24,<0.27",
    "tree-sitter-java>=0.23,<0.24",
]

[project.scripts]
mobileag = "mobileag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".kilo", "node_modules", "output", "uploads", "build", "dist"]
