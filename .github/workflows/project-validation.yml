name: Project validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
      - run: python -m pip install -c requirements/validated-python314.txt ".[test]" build setuptools wheel
      - run: python -m pytest -q
      - name: Location-aware accuracy regressions (synthetic candidates only)
        run: python scripts/evaluate-accuracy.py --corpus tests/fixtures/accuracy_instances.json
      - run: python -m build --wheel
      - name: Reproducible isolated wheel comparison
        run: python scripts/check-reproducible-wheel.py
      - run: python scripts/verify-dashboard-assets.py
      - name: Smoke installed wheel outside source checkout
        run: |
          TARGET=$(mktemp -d)
          python -m pip install --no-deps --target "$TARGET" dist/*.whl
          cd "$(mktemp -d)"
          PYTHONPATH="$TARGET" python "$GITHUB_WORKSPACE/scripts/wheel-smoke.py" --target "$TARGET"
      - name: Browser regressions (synthetic, devices disabled)
        run: |
          npm ci --prefix assets --ignore-scripts
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          CHROMIUM=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python tests/browser_accuracy_regression.py --chromium "$CHROMIUM"
          python tests/browser_dashboard_navigation.py --chromium "$CHROMIUM"
          python tests/browser_dashboard_tools_ui.py --chromium "$CHROMIUM" --axe assets/node_modules/axe-core/axe.min.js --output "$RUNNER_TEMP/dashboard-tools-ui"
          python tests/browser_product_regression.py --server-python "$(command -v python)" --chromium "$CHROMIUM" --axe assets/node_modules/axe-core/axe.min.js --output "$RUNNER_TEMP/browser-results"
          python tests/browser_test_plan_comparison.py --chromium "$CHROMIUM"
          python tests/browser_console_regression.py --server-python "$(command -v python)" --chromium "$CHROMIUM" --axe assets/node_modules/axe-core/axe.min.js --output "$RUNNER_TEMP/console-results"
