[project]
name = "mobileag"
version = "0.1.0"
description = "Multi-LLM mobile security analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "google-genai",
    "openai",
    "anthropic",
    "neo4j",
    "qdrant-client",
    "psycopg2-binary",
    "click",
    "jinja2",
    "pydantic",
    "rich",
    "python-dotenv",
    "aiohttp",
    "httpx",
    "weasyprint",
    "pydantic-settings",
]

[project.scripts]
mobileag = "mobileag.cli:main"
